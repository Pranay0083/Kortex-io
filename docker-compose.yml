services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kortex
      POSTGRES_PASSWORD: kortex
      POSTGRES_DB: kortex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kortex -d kortex"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kortex:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KORTEX_PORT: "8090"
      # Set POSTGRES_URL in .env to use an external database (e.g. Neon).
      POSTGRES_URL: ${POSTGRES_URL:-postgres://kortex:kortex@postgres:5432/kortex?sslmode=disable}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      PUBLIC_BASE_URL: http://localhost:8090
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # plain http on localhost: browsers drop Secure cookies otherwise
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@kortex.dev}
      NODE_NAME: ${NODE_NAME:-kortex-01}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # mount the .mmdb (see volumes below) and set GEOIP_DB=/geoip/GeoLite2-City.mmdb
      GEOIP_DB: ${GEOIP_DB:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kortex.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-kortex2026}
    # volumes:
    #   - ./geoip:/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8090:8090"

volumes:
  pgdata:
