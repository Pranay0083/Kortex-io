<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme before first paint so there is no flash. Mirrors ThemeContext.
      (function () {
        var t;
        try {
          t = localStorage.getItem("kx-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>Kortex · URL Shortener &amp; Real-Time Click Analytics</title>
    <meta
      name="description"
      content="Kortex — distributed URL shortener with Snowflake IDs, sharded Postgres, a Redis read path and a real-time columnar click analytics pipeline."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kortex" />
    <meta property="og:title" content="Kortex · URL Shortener & Real-Time Click Analytics" />
    <meta
      property="og:description"
      content="Snowflake IDs, consistent-hash sharded Postgres, a Redis read path and a columnar click analytics pipeline — all running live."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kortex · URL Shortener & Real-Time Click Analytics" />
    <meta
      name="twitter:description"
      content="Snowflake IDs, sharded Postgres, a Redis read path and a columnar click analytics pipeline."
    />
    <meta name="twitter:image" content="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
